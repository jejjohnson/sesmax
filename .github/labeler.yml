# PR auto-labeling rules.
#
# Applied by .github/workflows/label-pr.yml using actions/labeler.
# Labels referenced here must exist — run `make gh-labels` to create them.
# The `dependencies` label is also created by the bootstrap script so this
# file works on a fresh repo with no manual label setup.
#
# Scopes below map file paths to the standard taxonomy:
#   area:*   — which part of the project the change touches
#   layer:*  — which implementation layer (if the project has a layer stack)
#   type:*   — left to issue templates (NOT auto-applied on PRs)
#
# The layer:* scopes are the workspace's tiers (docs/design/workspace_and_core.md).

"area:engineering":
  - changed-files:
    - any-glob-to-any-file:
      - ".github/**"
      - "pyproject.toml"
      - "Makefile"
      - ".pre-commit-config.yaml"
      - "uv.lock"

"area:docs":
  - changed-files:
    - any-glob-to-any-file:
      - "docs/**"
      - "mkdocs.yml"
      - "notebooks/**"
      - "*.md"

"area:testing":
  - changed-files:
    - any-glob-to-any-file:
      - "tests/**"
      - "packages/*/tests/**"

# Catch-all for source changes that don't match a specific layer scope.
# Ensures every PR that touches package sources receives at least one area label.
"area:code":
  - changed-files:
    - any-glob-to-any-file: "packages/*/src/**"

# --- Layer scopes: the workspace tiers -------------------------------------
# Imports only point down the tiers (tests/test_workspace.py checks it).
#
#   layer:0-core        sesmax-core — imports no component
#   layer:1-components  sesmax-ocean, sesmax-atmos, … — import the core only
#   layer:2-coupler     sesmax-couple — imports the components

"layer:0-core":
  - changed-files:
    - any-glob-to-any-file: "packages/sesmax-core/**"

"layer:1-components":
  - changed-files:
    - any-glob-to-any-file:
      - "packages/sesmax-ocean/**"
      - "packages/sesmax-atmos/**"
      - "packages/sesmax-land/**"
      - "packages/sesmax-ice/**"

"layer:2-coupler":
  - changed-files:
    - any-glob-to-any-file: "packages/sesmax-couple/**"

# --- Default / legacy labels retained for Dependabot compatibility ---------

"dependencies":
  - changed-files:
    - any-glob-to-any-file:
      - "pyproject.toml"
      - ".pre-commit-config.yaml"
      - "uv.lock"
