name: Full Tests (slow + integration)

# The PR job (ci.yml) runs only the fast tier (`-m "not slow"`). This workflow
# runs the complete suite, including the slow gradient-through-integration
# tests, on demand and once a week.
on:
  workflow_dispatch:
    inputs:
      marker:
        description: >-
          pytest -m expression to select tests (default: the full suite).
          Examples: "slow", "integration", "slow and not integration".
        required: false
        default: ""
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

jobs:
  full-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --group dev
      - name: Run the full test suite with coverage
        env:
          MARKER: ${{ inputs.marker }}
        run: |
          if [ -n "$MARKER" ]; then
            uv run pytest -v -m "$MARKER"
          else
            uv run pytest -v
          fi
      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-full
          path: coverage.xml
