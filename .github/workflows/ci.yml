name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        # The dev group installs every workspace package (as editable members).
        run: uv sync --group dev
      - name: Run tests with coverage
        # The slow tier (gradients through long integrations) runs in
        # full-tests.yml; packages/sesmax-core/tests/conftest.py tags it.
        run: uv run pytest -v -m "not slow"
      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  # Each package installed alone into a clean venv, with no workspace around
  # it: proves its base install is complete, that it imports no package above
  # its tier (docs/design/workspace_and_core.md), and that no optional extra
  # is pulled in. The stack's git pins only resolve together with the
  # workspace's override-dependencies (gaussx, pipekit), so those are passed
  # in, read from the root pyproject.toml.
  bare-install:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package:
          - {dist: sesmax-core, module: sesmax_core}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Install ${{ matrix.package.dist }} alone
        run: |
          python -c "import tomllib; print('\n'.join(tomllib.load(open('pyproject.toml', 'rb'))['tool']['uv']['override-dependencies']))" > overrides.txt
          uv venv bare
          uv pip install --python bare ./packages/${{ matrix.package.dist }} --override overrides.txt
      - name: Import ${{ matrix.package.module }}; no optional extra present
        run: >-
          bare/bin/python -c "import importlib.util as u, ${{ matrix.package.module }};
          extras = ['xarray', 'zarr', 'orbax', 'filterax', 'vardax', 'flowjax'];
          present = [m for m in extras if u.find_spec(m)];
          assert not present, present"
