name: Type Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Install typecheck dependencies
        # The packages are installed so ty resolves imports between them.
        run: uv sync --all-packages --group typecheck
      - name: Run ty check
        run: uv run --group typecheck ty check packages/sesmax-core/src packages/sesmax/src scripts
