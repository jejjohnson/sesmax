# ---------------------------------------------------------------------------
# mystmd builds the prose half of the documentation: home page, guides, and
# executed example notebooks. The API reference is built separately by MkDocs
# + mkdocstrings and mounted at `/reference/`. See `docs/README.md`.
#
# `references.api` points at a LOCAL server because mystmd only loads
# intersphinx inventories over http(s) — a filesystem path is rejected and a
# `file://` URL is silently ignored. `scripts/build_docs.py` serves the freshly
# built MkDocs `site/` on this exact port, then rewrites the resulting
# localhost URLs to the deployed `/reference/` path. Keep the port in sync
# with API_PORT in that script.
# ---------------------------------------------------------------------------
version: 1

project:
  id: sesmax-docs
  title: sesmax
  description: >-
    Simple Earth-system models in JAX: cheap, differentiable forward models
    to use as priors in short-window data assimilation.
  github: https://github.com/jejjohnson/sesmax
  authors:
    - name: J. Emmanuel Johnson
  references:
    api: http://127.0.0.1:8910/
  bibliography:
    - references.bib
  toc:
    - file: index.md
    - title: Foundations
      children:
        - file: notebooks/cgrid_and_boundaries.ipynb
    - file: guide/steps_to_navier_stokes.md
      children:
        - file: notebooks/step01_linear_convection_1d.ipynb
        - file: notebooks/step02_nonlinear_convection_1d.ipynb
        - file: notebooks/step03_diffusion_1d.ipynb
        - file: notebooks/step04_burgers_1d.ipynb
        - file: notebooks/step05_linear_convection_2d.ipynb
        - file: notebooks/step06_nonlinear_convection_2d.ipynb
        - file: notebooks/step07_diffusion_2d.ipynb
        - file: notebooks/step08_burgers_2d.ipynb
        - file: notebooks/step09_laplace_2d.ipynb
        - file: notebooks/step10_poisson_2d.ipynb
        - file: notebooks/step11_helmholtz_2d.ipynb
        - file: notebooks/step12_cavity_flow.ipynb
        - file: notebooks/step13_channel_flow.ipynb
    - file: guide/chaos_and_predictability.md
      children:
        - file: notebooks/lorenz63_simulation.ipynb
        - file: notebooks/lorenz96_simulation.ipynb
        - file: notebooks/lorenz96t_simulation.ipynb
    - title: Rotating shallow water
      children:
        - file: notebooks/step14_gravity_waves_1d.ipynb
        - file: notebooks/step15_shallow_water_1d.ipynb
        - file: notebooks/step16_geostrophic_adjustment.ipynb
    - title: Data assimilation
      children:
        - file: notebooks/data_assimilation_etkf.ipynb
        - file: notebooks/data_assimilation_4dvar.ipynb
    - title: Design
      children:
        - file: design/workspace_and_core.md
    - title: Project
      children:
        - file: contributing.md
        - file: changelog.md

site:
  title: sesmax
  template: book-theme
  options:
    logo_text: sesmax
  # mystmd requires a full URL here (both `/reference/` and `reference/` are
  # rejected), so the deployed location is hard-coded the way `repo_url` is in
  # mkdocs.yml.
  #
  # Do NOT rewrite this to a root-relative path at build time. The theme
  # re-renders the nav from this config on hydration and prepends BASE_URL to
  # any URL starting with `/`, so a rewritten value becomes
  # `/sesmax/sesmax/reference/` and 404s. An absolute
  # URL is treated as external and left alone. The cost is that a local
  # preview's nav button points at the deployed site.
  nav:
    - title: API reference
      url: https://jejjohnson.github.io/sesmax/reference/
