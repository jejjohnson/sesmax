[project]
name = "sesmax-workspace"
version = "0.0.0"
description = "sesmax workspace root (not published; the shipped packages are under packages/)."
authors = [
    {name = "J. Emmanuel Johnson", email = "jemanjohnson34@gmail.com"},
]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.12"
classifiers = ["Private :: Do Not Upload"]
dependencies = []

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv]
# Copied from somax at 9cb19b3. filterax pins gaussx to a commit while vardax
# asks for a bare ``gaussx`` and finitevolX needs gaussx >= 0.6.5: force
# finitevolX's tag across the graph. finitevolX pins pipekit to a commit while
# vardax follows pipekit's main: force the same commit everywhere (bump all
# three with finitevolX's pin, and with packages/sesmax-core/pyproject.toml).
override-dependencies = [
    "gaussx @ git+https://github.com/jejjohnson/gaussx@v0.6.5",
    "pipekit @ git+https://github.com/jejjohnson/pipekit.git@d1eb41d4ac98c371cb198ee72aedfdf45046127c#subdirectory=packages/pipekit",
    "pipekit-cycle @ git+https://github.com/jejjohnson/pipekit.git@d1eb41d4ac98c371cb198ee72aedfdf45046127c#subdirectory=packages/pipekit-cycle",
    "pipekit-jax @ git+https://github.com/jejjohnson/pipekit.git@d1eb41d4ac98c371cb198ee72aedfdf45046127c#subdirectory=packages/pipekit-jax",
]

[tool.uv.sources]
sesmax = { workspace = true }
sesmax-core = { workspace = true }

[dependency-groups]
dev = [
    # Workspace members are dev-installed so the tests can import them, with
    # every optional extra so the tests of the optional modules run.
    "sesmax",
    "sesmax-core[da,flows,xarray,checkpoint]",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "pre-commit>=4.6.0",
]
lint = [
    "ruff>=0.15.22",
]
typecheck = [
    "ty>=0.0.83",
]
docs = [
    # The prose half of the site is built by mystmd, a Node CLI installed with
    # `npm install -g mystmd` rather than through uv. See docs/README.md.
    # MkDocs here builds only the API reference, whose `objects.inv` is what
    # lets the MyST prose cross-reference into it.
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
    "jupytext>=1.19.6",
    "ipykernel>=7.3.0",
    "nbconvert>=7.17.2",
    # matplotlib + watermark used by the example notebooks during local
    # re-execution. The guarded watermark cell in each notebook no-ops
    # if the package is missing, but installing it here lets the version
    # readout actually print under `nbconvert --execute`.
    "matplotlib>=3.11.2",
    "watermark>=2.6.0",
    # pygments 2.20.0 dropped the None -> '' coercion for HtmlFormatter(filename=...),
    # but pymdownx.highlight 10.21.x still passes the untitled-code-block title
    # through as None. Pin until a fixed pymdown-extensions release ships (#38).
    "pygments>=2.21.0,<2.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The workspace root ships no code; the wheels are built from packages/*.
bypass-selection = true

[tool.ruff]
target-version = "py312"
line-length = 88
# First-party packages, for import sorting.
src = ["packages/*/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# F722: jaxtyping shape strings ("Ny Nx") read as forward annotations.
ignore = ["E402", "E721", "E731", "E741", "F722"]

[tool.ruff.lint.isort]
combine-as-imports = true
lines-after-imports = 2

[tool.ruff.lint.per-file-ignores]
# Tests deliberately construct invalid inputs and assert on the failure.
"tests/**" = ["B011"]
"packages/*/tests/**" = ["B011"]

[tool.ruff.format]
# Format the code inside ``Examples:`` doctest blocks like real source.
docstring-code-format = true
docstring-code-line-length = 72

[tool.ty.environment]
python-version = "3.12"

# Copied from somax at 9cb19b3 so the moved code type-checks unchanged.
# Removing them, one rule per PR, is sesmax#30.
[tool.ty.rules]
call-non-callable = "ignore"  # eqx.Module subclasses with __call__
invalid-argument-type = "ignore"
invalid-assignment = "ignore"
invalid-method-override = "ignore"
invalid-parameter-default = "ignore"
invalid-return-type = "ignore"
not-iterable = "ignore"
unresolved-attribute = "ignore"
unresolved-import = "ignore"  # optional deps (orbax) + git-based deps

[tool.pytest.ini_options]
# Each package's tests, the workspace tests (docs build, capability index), and
# each package's sources, so that --doctest-modules collects the ``Examples:``
# blocks in every Google-style docstring. They are executable documentation:
# if an example in the docs goes stale, CI fails.
testpaths = [
    "tests",
    "packages/sesmax-core/tests",
    "packages/sesmax-core/src/sesmax_core",
]
# Test tiers (see "Test tiers" in AGENTS.md). CI runs every tier.
strict_markers = true
xfail_strict = true
filterwarnings = ["error", "ignore::DeprecationWarning"]
markers = [
    "slow: takes over ~1 s; deselect with -m 'not slow'",
    "integration: end-to-end workflows, optional dependencies, external tools",
]
# importlib mode lets two packages each have a tests/test_public_api.py.
addopts = """\
    --import-mode=importlib \
    --doctest-modules \
    --cov=sesmax_core \
    --cov=sesmax \
    --cov-report=term-missing \
    --cov-report=xml:coverage.xml\
"""

[tool.coverage.run]
omit = ["tests/*", "packages/*/tests/*"]

[tool.coverage.report]
show_missing = true
# Very low to start (SX-6 in docs/design/workspace_and_core.md); raised in
# follow-ups as the moved code gains tests.
fail_under = 30
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
