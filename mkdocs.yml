# ---------------------------------------------------------------------------
# MkDocs builds ONLY the API reference, which is deployed as the `/reference/`
# subtree of the MyST site. Prose, guides, and notebooks are built by mystmd
# from `docs/myst.yml`. See `docs/README.md` for the split and the rationale.
#
# mkdocstrings publishes a Sphinx-compatible `objects.inv` into `site/`, and
# that inventory is what lets the MyST prose cross-reference into these pages.
# ---------------------------------------------------------------------------
site_name: sesmax API reference
site_description: API reference for the sesmax packages — generated from Google-style docstrings.
site_author: J. Emmanuel Johnson
repo_url: https://github.com/jejjohnson/sesmax
repo_name: jejjohnson/sesmax

docs_dir: docs/api
site_dir: site

# The guide pages live in the MyST half of the site, so links to them point
# outside `docs_dir` by design. The assembled-site link checker in
# `scripts/build_docs.py` validates them instead — across both halves, which
# neither tool can do on its own.
validation:
  links:
    unrecognized_links: ignore
    absolute_links: ignore

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.follow
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [packages/sesmax-core/src]
          options:
            docstring_style: google
            # Docstrings moved from somax document **kwargs without a type and
            # list dataclass fields under Args; griffe would warn, and strict
            # mode would fail the build on docs that are correct as written.
            docstring_options:
              warn_unknown_params: false
              warn_missing_types: false
            docstring_section_style: table
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_signature_annotations: true
            signature_crossrefs: true
            separate_signature: true
            members_order: source
            merge_init_into_class: true
            heading_level: 3
            filters: ["!^_"]

nav:
  - Overview: index.md
  - Capability index: capabilities.md
  - Types and models: core.md
  - Terms: terms.md
  - Forcing: forcing.md
  - Scales: scales.md
  - Layered fluids: gfd.md
  - Domains: domain.md
  - Solvers: solvers.md
  - Training rollouts: train.md
  - Monitors: monitor.md
  - Operators: operators.md
  - Data assimilation: da.md
  - Flows: flows.md
  - I/O: io.md
  - Checkpointing: checkpoint.md
  - Guards: guards.md
  - Test problems: testing.md
