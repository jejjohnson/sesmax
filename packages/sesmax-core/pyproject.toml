[project]
name = "sesmax-core"
version = "0.2.0"
description = "The core of sesmax: state, terms, steppers, forcing, DA adapters and I/O shared by every simple Earth-system model in JAX."
authors = [
    {name = "J. Emmanuel Johnson", email = "jemanjohnson34@gmail.com"},
]
license = { file = "LICENSE" }
readme = "README.md"
keywords = ["jax", "equinox", "earth system", "data assimilation"]
requires-python = ">=3.12"
classifiers = [
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Natural Language :: English",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Development Status :: 2 - Pre-Alpha",
]
# Each git dependency is pinned to a tag.
# Git dependencies are direct references so a bare install of this package
# resolves the same commits without the workspace around it.
dependencies = [
    "jax>=0.10.2",
    "jaxlib>=0.11.1",
    "jaxtyping>=0.3.9",
    "equinox>=0.13.8",
    "diffrax>=0.7.2",
    "lineax>=0.1.1",
    "optimistix>=0.1",
    "einops>=0.8.2",
    # Constrained / frozen parameters: ``positive`` and ``interval`` store a
    # bounded parameter in an unconstrained space, so an optimiser can never
    # step a viscosity or a drag negative.
    "paramax>=0.0.5",
    "spectraldiffx @ git+https://github.com/jejjohnson/spectraldiffx.git@0.1.2",
    # The grids, masks and C-grid operators every grid-based model is written
    # on, with gridax.solvers (the ``jax`` extra: masked operators, multigrid,
    # capacitance) and gridax.pipekit (the ``pipekit`` extra: the diagnostic
    # graphs). Pinned to gridax main at 494d73d (gridax#536, the canonical
    # functions on located fields), which no release holds yet.
    "gridax[jax,pipekit] @ git+https://github.com/jejjohnson/gridax.git@494d73d7b11b2607942d43b24dfb05f9a29f9437#subdirectory=packages/gridax",
    # Every pipekit package at the one tag pipekit-ops-v0.2.1: per-package
    # tags make uv report conflicting URLs for pipekit-ops.
    "pipekit-ops @ git+https://github.com/jejjohnson/pipekit.git@pipekit-ops-v0.2.1#subdirectory=packages/pipekit-ops",
    "pipekit-array @ git+https://github.com/jejjohnson/pipekit.git@pipekit-ops-v0.2.1#subdirectory=packages/pipekit-array",
    "pipekit-cycle @ git+https://github.com/jejjohnson/pipekit.git@pipekit-ops-v0.2.1#subdirectory=packages/pipekit-cycle",
    "pipekit-jax @ git+https://github.com/jejjohnson/pipekit.git@pipekit-ops-v0.2.1#subdirectory=packages/pipekit-jax",
    # The reference density the wind-stress operators default to; geophysix
    # owns the physical constants.
    "geophysix @ git+https://github.com/jejjohnson/geophysix.git@v0.0.3",
    # The spatial bases of the forcing bank (only ``geonnax.basis`` is used).
    "geonnax @ git+https://github.com/jejjohnson/geonnax.git@v0.0.11",
    # The IMEX solver, its step-size controller and the CFL bound
    # (``sesmax_core.solvers`` re-exports them from ``integrix.march``), and
    # the path that reads sampled forcing.
    "integrix @ git+https://github.com/jejjohnson/integrix@v0.0.10",
    # The 1-D schemes and end policies of ``InterpolatedForcing``.
    "functax[jax] @ git+https://github.com/jejjohnson/functax@v0.0.13",
]

[project.optional-dependencies]
# Ensemble filters (filterax) and variational assimilation (vardax) drive any
# model through ``sesmax_core.da``.
da = [
    "filterax @ git+https://github.com/jejjohnson/filterax@v0.0.6",
    "vardax @ git+https://github.com/jejjohnson/vardax@v0.3.5",
]
# The flowjax bridge in ``sesmax_core.flows``.
flows = [
    "flowjax",
]
# State <-> xarray Dataset and Zarr in ``sesmax_core.io``.
xarray = [
    "xarray>=2026.4.0",
    "zarr>=3.1.6",
]
# The orbax checkpointer in ``sesmax_core.checkpoint``.
checkpoint = [
    "orbax-checkpoint>=0.11.37",
]

[project.urls]
Repository = "https://github.com/jejjohnson/sesmax"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/sesmax_core"]

[tool.uv.sources]
# gridax sources spectraldiffx by git *tag*; uv needs the same form for one
# package across the graph, and a source takes precedence over the direct
# reference above (which pip users still get).
spectraldiffx = { git = "https://github.com/jejjohnson/spectraldiffx.git", tag = "0.1.2" }
geophysix = { git = "https://github.com/jejjohnson/geophysix.git", tag = "v0.0.3" }
gridax = { git = "https://github.com/jejjohnson/gridax.git", rev = "494d73d7b11b2607942d43b24dfb05f9a29f9437", subdirectory = "packages/gridax" }
