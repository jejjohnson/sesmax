[project]
name = "sesmax-core"
version = "0.0.0"
description = "The core of sesmax: state, terms, steppers, forcing, DA adapters and I/O shared by every simple Earth-system model in JAX."
authors = [
    {name = "J. Emmanuel Johnson", email = "jemanjohnson34@gmail.com"},
]
license = { file = "LICENSE" }
readme = "README.md"
keywords = ["jax", "equinox", "earth system", "data assimilation"]
requires-python = ">=3.12"
classifiers = [
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Natural Language :: English",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Development Status :: 2 - Pre-Alpha",
]
# Empty in phase C0; phase C1 adds the base install and the [da], [flows],
# [xarray] and [checkpoint] extras with the code (docs/design/workspace_and_core.md).
dependencies = []

[project.urls]
Repository = "https://github.com/jejjohnson/sesmax"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sesmax_core"]
