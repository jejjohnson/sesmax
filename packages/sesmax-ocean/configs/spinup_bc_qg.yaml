# Three years of spinup of the three-layer double gyre, for its final state alone, from
# which doublegyre_bc_qg starts.
#
# Three years are the time a baroclinic Rossby wave takes across the basin. They give a
# formed western boundary current with its first eddies. A longer spinup starts better:
# 10 years for production, 40 for a publication.
scenario:
  name: double_gyre
  grid:
    nx: 128
    ny: 128
    Lx: 4000000.0
    Ly: 4000000.0
  consts:
    f0: 9.375e-05
    beta: 1.754e-11
  forcing:
    wind_amplitude: 1.3e-10
    wind_profile: doublegyre
  initial_condition:
    type: at_rest
model:
  name: multilayer_qg
  stratification:
    H: [400.0, 1100.0, 2600.0]
    g_prime: [9.81, 0.025, 0.0125]
  params:
    lateral_viscosity: 15.0
    bottom_drag: 1.0e-07
timestepping:
  t0: 0.0
  t1: 94672800.0
  dt: 600.0
  save_interval: 94672800.0
output:
  write_snapshots: false
  write_metrics: false
debug:
  scenario:
    grid:
      nx: 32
      ny: 32
  timestepping:
    t1: 86400.0
    save_interval: 86400.0
