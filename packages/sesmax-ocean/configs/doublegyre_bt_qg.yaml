# The wind-driven double gyre of a barotropic ocean: 1000 km, 64² cells, one year.
#
# Cheap. At 1 m/s the advective Courant number is about 0.04.
scenario:
  name: double_gyre
  grid:
    nx: 64
    ny: 64
    Lx: 1000000.0
    Ly: 1000000.0
  consts:
    f0: 0.0001
    beta: 1.6e-11
  forcing:
    wind_amplitude: 1.0e-12
    wind_profile: doublegyre
  initial_condition:
    type: at_rest
model:
  name: barotropic_qg
  params:
    lateral_viscosity: 500.0
    bottom_drag: 1.0e-07
timestepping:
  t0: 0.0
  t1: 31557600.0
  dt: 600.0
  save_interval: 2592000.0
output:
  write_snapshots: true
  write_metrics: true
debug:
  scenario:
    grid:
      nx: 32
      ny: 32
  timestepping:
    t1: 86400.0
    save_interval: 600.0
assertions:
  cfl:
    wave_speed_m_per_s: 2.0
    max_cfl: 0.5
  bounded_metric:
    name: kinetic_energy
    min: 0.0
    max: 1000000000000000.0
