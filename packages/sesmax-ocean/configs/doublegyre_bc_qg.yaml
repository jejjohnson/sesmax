# One year of the three-layer double gyre, to be started from the end of spinup_bc_qg:
#
#   sesmax-experiment restart --config doublegyre_bc_qg.yaml --from <spinup>/final_state.zarr
#
# The layers and the forcing are those of MQGeometry (Thiry et al., 2024, GMD).
scenario:
  name: double_gyre
  grid:
    nx: 128
    ny: 128
    Lx: 4000000.0
    Ly: 4000000.0
  consts:
    f0: 9.375e-05
    beta: 1.754e-11
  forcing:
    wind_amplitude: 1.3e-10
    wind_profile: doublegyre
  initial_condition:
    type: at_rest
model:
  name: multilayer_qg
  stratification:
    H: [400.0, 1100.0, 2600.0]
    g_prime: [9.81, 0.025, 0.0125]
  params:
    lateral_viscosity: 15.0
    bottom_drag: 1.0e-07
timestepping:
  t0: 0.0
  t1: 31557600.0
  dt: 600.0
  save_interval: 2592000.0
output:
  write_snapshots: true
  write_metrics: true
debug:
  scenario:
    grid:
      nx: 32
      ny: 32
  timestepping:
    t1: 86400.0
    save_interval: 600.0
