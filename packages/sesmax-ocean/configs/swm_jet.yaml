# The baroclinic instability of a jet in two shallow layers: 1000 km, 64² cells, 30 days.
#
# No wind: the energy is in the shear of the jet, which is opposite in the two layers.
# Cheap.
scenario:
  name: double_gyre
  grid:
    nx: 64
    ny: 64
    Lx: 1000000.0
    Ly: 1000000.0
  consts:
    f0: 0.0001
    beta: 1.6e-11
  initial_condition:
    type: jet
    params:
      jet_speed: 0.5
      jet_width: 50000.0
      perturbation: 0.01
model:
  name: multilayer_nonlinear_swm
  stratification:
    H: [500.0, 4500.0]
    g_prime: [9.81, 0.025]
  params:
    lateral_viscosity: 1000.0
    bottom_drag: 1.0e-07
timestepping:
  t0: 0.0
  t1: 2592000.0
  dt: 20.0
  save_interval: 86400.0
output:
  write_snapshots: true
  write_metrics: true
debug:
  scenario:
    grid:
      nx: 32
      ny: 32
  timestepping:
    t1: 86400.0
    save_interval: 600.0
assertions:
  cfl:
    wave_speed_m_per_s: 221.0
    max_cfl: 0.5
