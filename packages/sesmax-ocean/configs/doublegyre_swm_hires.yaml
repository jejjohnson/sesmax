# The three-layer double gyre in shallow water at 256², beside doublegyre_bc_qg_hires:
# five years from rest. It keeps what quasi-geostrophy drops: gravity waves, ageostrophic
# flow and layers that thin.
#
# Layers, scheme, wind and walls are those of qgsw-pytorch (louity/qgsw-pytorch). The
# dissipation is WENO-Z's alone, with no viscosity. `wind_amplitude` is the kinematic
# stress, 0.08 Pa / 1000 kg/m³, on the top layer.
#
# One number is not: the external gravity. g'[0] = 9.81 makes waves of 200 m/s and a step
# of 40 s, days per simulated year on a CPU. 0.2 makes 29 m/s and 220 s, and slows only
# the surface wave, which crosses the basin in 1.5 days; the eddies live on g'[1] and
# g'[2]. One layer would not do, because it has no baroclinic instability.
scenario:
  name: double_gyre
  grid:
    nx: 256
    ny: 256
    Lx: 4000000.0
    Ly: 4000000.0
  consts:
    f0: 9.375e-05
    beta: 1.754e-11
  forcing:
    wind_amplitude: 8.0e-05
    wind_profile: doublegyre
  initial_condition:
    type: at_rest
model:
  name: multilayer_nonlinear_swm
  stratification:
    H: [400.0, 1100.0, 2600.0]
    g_prime: [0.2, 0.025, 0.0125]
  params:
    lateral_viscosity: 0.0
    bottom_drag: 1.0e-07
    bc: wall
    method: wenoz5
timestepping:
  t0: 0.0
  t1: 157788000.0
  dt: 220.0
  save_interval: 2592000.0
output:
  write_snapshots: true
  write_metrics: true
debug:
  scenario:
    grid:
      nx: 32
      ny: 32
  timestepping:
    t1: 86400.0
    save_interval: 600.0
assertions:
  cfl:
    wave_speed_m_per_s: 33.0
    max_cfl: 0.5
