[project]
name = "sesmax-ocean"
version = "0.0.0"
description = "Simple ocean models in JAX: quasi-geostrophic, shallow-water and spherical models on sesmax-core."
authors = [
    {name = "J. Emmanuel Johnson", email = "jemanjohnson34@gmail.com"},
]
license = { file = "LICENSE" }
readme = "README.md"
keywords = ["jax", "equinox", "ocean", "quasi-geostrophic", "shallow water"]
requires-python = ">=3.12"
classifiers = [
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Natural Language :: English",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Development Status :: 2 - Pre-Alpha",
]
# The versions and git references are sesmax-core's, in the same form.
dependencies = [
    "sesmax-core",
    "jax>=0.10.2",
    "jaxtyping>=0.3.9",
    "equinox>=0.13.8",
    "paramax>=0.0.5",
    "gridax[jax,pipekit] @ git+https://github.com/jejjohnson/gridax@gridax-v0.3.3#subdirectory=packages/gridax",
    # The elliptic inversion on the sphere.
    "gaussx @ git+https://github.com/jejjohnson/gaussx@v0.8.1",
    # The Coriolis parameter of the beta-plane, the radius of the Earth.
    "geophysix @ git+https://github.com/jejjohnson/geophysix@v0.0.9",
]

[project.urls]
Repository = "https://github.com/jejjohnson/sesmax"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/sesmax_ocean"]

[tool.uv.sources]
geophysix = { git = "https://github.com/jejjohnson/geophysix", tag = "v0.0.9" }
gridax = { git = "https://github.com/jejjohnson/gridax", tag = "gridax-v0.3.3", subdirectory = "packages/gridax" }
