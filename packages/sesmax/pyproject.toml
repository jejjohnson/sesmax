[project]
name = "sesmax"
version = "0.0.0"
description = "Simple Earth-system models in JAX: installs the sesmax packages."
authors = [
    {name = "J. Emmanuel Johnson", email = "jemanjohnson34@gmail.com"},
]
license = { file = "LICENSE" }
readme = "README.md"
keywords = ["jax", "equinox", "earth system", "data assimilation"]
requires-python = ">=3.12"
classifiers = [
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Natural Language :: English",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Development Status :: 2 - Pre-Alpha",
]
# Code-free umbrella (SX-1): it only installs the components. sesmax-ocean
# joins in phase C2.
dependencies = [
    "sesmax-core",
]

[project.urls]
Repository = "https://github.com/jejjohnson/sesmax"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sesmax"]
